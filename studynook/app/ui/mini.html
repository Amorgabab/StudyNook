<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    html, body { background: transparent !important; }
    #pill {
      position: absolute; inset: 10px; border-radius: 999px; display: flex; align-items: center; gap: 10px;
      padding-inline: 14px 18px; background: var(--surface); border: 1px solid var(--border);
      border-inline-start: 3px solid var(--accent); box-shadow: 0 2px 6px rgba(0, 0, 0, .28);   /* stays inside the 10px margin: a bigger one is clipped into a visible square */
      cursor: pointer;   /* click anywhere but the icon to bring StudyNook back (a drag region swallows clicks) */
    }
    #pill.brk { border-inline-start-color: var(--success); }
    #stage { -webkit-app-region: drag; cursor: grab; width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
    #pill.brk #stage { background: var(--success-soft); color: var(--success); }
    #time { font-size: 20px; line-height: 1; font-weight: 600; font-variant-numeric: tabular-nums; direction: ltr; }
    #lbl { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>
  <div id="pill" role="timer"><span id="stage"></span><span id="time">25:00</span><span id="lbl"></span></div>
  <script src="../shared/lang/en.js"></script>
  <script src="../shared/lang/ar.js"></script>
  <script src="../shared/lang/fr.js"></script>
  <script src="../shared/lang/es.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/uiprefs.js"></script>
  <script src="../shared/icons.js"></script>
  <script src="js/util.js"></script>
  <script src="mini.js"></script>
</body>
</html>
