<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:;" />
  <title>StudyNook</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="titlebar">
    <div class="brand"><span class="brand-mark" id="brand-mark"></span><span>StudyNook</span></div>
    <div class="tb-right">
      <div class="tb-chip" id="chip-level"></div>
      <div class="tb-chip" id="chip-streak"></div>
      <div class="winbtns">
        <button class="winbtn" id="btn-min"></button>
        <button class="winbtn close" id="btn-close"></button>
      </div>
    </div>
  </header>

  <div class="shell">
    <nav class="sidebar" id="sidebar" aria-label="Main"></nav>
    <main id="view" class="view"></main>
  </div>

  <div id="toasts" role="status" aria-live="polite"></div>
  <div id="modal-root" role="dialog" aria-modal="true"></div>
  <div id="tour-root" role="dialog" aria-modal="true"></div>

  <!-- translations (must load before i18n.js) -->
  <script src="../shared/lang/en.js"></script>
  <script src="../shared/lang/ar.js"></script>
  <script src="../shared/lang/fr.js"></script>
  <script src="../shared/lang/es.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/uiprefs.js"></script>
  <script src="../shared/icons.js"></script>
  <!-- pure shared logic (also used by the engine + tests) -->
  <script src="../shared/progress.js"></script>
  <script src="../shared/catalog.js"></script>
  <script src="../shared/quotes.js"></script>
  <script src="../shared/iron.js"></script>
  <script src="../../extension/rules.js"></script>
  <!-- help articles -->
  <script src="help/help-en.js"></script>
  <script src="help/help-ar.js"></script>
  <script src="help/help-fr.js"></script>
  <script src="help/help-es.js"></script>
  <!-- ui -->
  <script src="js/util.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/mochi.js"></script>
  <script src="js/views-home.js"></script>
  <script src="js/views-manage.js"></script>
  <script src="js/views-garden.js"></script>
  <script src="js/views-misc.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
