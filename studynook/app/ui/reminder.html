<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { background: var(--surface); }
    #card { position: absolute; inset: 0; display: flex; flex-direction: column; gap: var(--s-4); padding: var(--s-6); border-top: 3px solid var(--warning); }
    .head { display: flex; align-items: flex-start; gap: var(--s-3); }
    .badge-icon { width: 40px; height: 40px; border-radius: 50%; background: var(--warning-soft); color: var(--warning); display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
    h1 { font-size: 16px; line-height: 22px; font-weight: 600; }
    #count { font-size: 32px; line-height: 36px; font-weight: 600; color: var(--warning); font-variant-numeric: tabular-nums; }
    .btns { display: flex; gap: var(--s-2); margin-top: auto; }
    .btns .btn { flex: 1; }
  </style>
</head>
<body>
  <div id="card" role="alertdialog" aria-labelledby="title" aria-describedby="sub">
    <div class="head">
      <span class="badge-icon" id="ico"></span>
      <div class="grow"><h1 id="title"></h1><p class="small" id="sub"></p></div>
    </div>
    <div class="row" id="countrow"><span id="count">15</span><span class="small" id="countlbl"></span></div>
    <div class="btns">
      <button class="btn" id="b-leave" type="button"></button>
      <button class="btn btn-primary" id="b-close" type="button"></button>
      <button class="btn btn-ghost" id="b-self" type="button"></button>
    </div>
  </div>
  <script src="../shared/lang/en.js"></script>
  <script src="../shared/lang/ar.js"></script>
  <script src="../shared/lang/fr.js"></script>
  <script src="../shared/lang/es.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/uiprefs.js"></script>
  <script src="../shared/icons.js"></script>
  <script src="js/util.js"></script>
  <script src="reminder.js"></script>
</body>
</html>
