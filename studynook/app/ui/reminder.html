<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; background: transparent; }
    #card {
      position: absolute; inset: 0; background: #FFFCF6;
      border: 2px solid #F2C14E; border-radius: 24px;
      box-shadow: 0 14px 40px rgba(122, 91, 62, .3);
      padding: 18px 22px; display: flex; flex-direction: column; gap: 8px;
      color: #4A3B32; user-select: none;
    }
    .head { display: flex; align-items: center; gap: 10px; }
    .head .e { font-size: 30px; }
    h1 { font-size: 15px; margin: 0; }
    .sub { font-size: 12px; color: #8A7466; }
    .count { font-size: 30px; font-weight: 800; color: #E8886B; font-variant-numeric: tabular-nums; }
    .btns { display: flex; gap: 8px; margin-top: auto; }
    button { border-radius: 999px; border: 1.5px solid #EBDCC8; background: #FFF6E9; padding: 8px 14px; font-size: 12px; font-weight: 700; cursor: pointer; color: #4A3B32; }
    button:hover { transform: translateY(-1px); }
    .primary { background: #E8886B; border-color: #E8886B; color: #fff; }
    .sage { background: #7FB685; border-color: #7FB685; color: #fff; }
  </style>
</head>
<body>
  <div id="card">
    <div class="head">
      <span class="e">🕊️</span>
      <div>
        <h1 id="title">Heads up…</h1>
        <div class="sub" id="sub">a distraction is open</div>
      </div>
    </div>
    <div class="count" id="count">15</div>
    <div class="sub">seconds until Mochi gently closes it. Save your work!</div>
    <div class="btns">
      <button class="sage" id="b-leave">Leave it open 5 min</button>
      <button class="primary" id="b-close">Close it now</button>
      <button id="b-self">I'll close it myself</button>
    </div>
  </div>
  <script src="reminder.js"></script>
</body>
</html>
