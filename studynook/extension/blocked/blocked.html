<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <title>StudyNook</title>
  <link rel="stylesheet" href="../ui.css" />
  <style>
    html, body { height: 100%; }
    body { display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { width: min(480px, 100%); padding: 40px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; box-shadow: var(--shadow-2); }
    .halo { width: 56px; height: 56px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 4px; }
    h1 { font-size: 20px; line-height: 28px; font-weight: 600; }
    p { color: var(--text-muted); }
    .timer { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; }
    .quote { font-size: 13px; line-height: 20px; color: var(--text-faint); font-style: italic; max-width: 360px; }
    .btns { display: flex; gap: 8px; margin-top: 12px; }
  </style>
</head>
<body>
  <main class="card">
    <span class="halo" id="halo"></span>
    <h1 id="headline"></h1>
    <span class="chip" id="dom"></span>
    <p id="line"></p>
    <div class="timer" id="timer"></div>
    <div class="quote" id="quote"></div>
    <div class="btns">
      <button class="btn btn-primary" id="back" type="button"></button>
      <button class="btn" id="close-tab" type="button"></button>
    </div>
    <div class="caption" id="meta"></div>
  </main>
  <script src="../rules.js"></script>
  <script src="../icons.js"></script>
  <script src="../i18n.js"></script>
  <script src="blocked.js"></script>
</body>
</html>
