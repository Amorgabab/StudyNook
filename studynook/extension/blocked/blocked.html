<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing:border-box; margin:0; font-family:"Segoe UI", system-ui, sans-serif; }
    html, body { height:100%; }
    body {
      display:flex; align-items:center; justify-content:center;
      background:linear-gradient(160deg, #FDF0E0 0%, #F6E7D6 55%, #EFE3D0 100%);
      color:#4A3B32; overflow:hidden;
    }
    .moon { position:absolute; width:340px; height:340px; border-radius:50%; background:radial-gradient(circle at 35% 35%, #FFF9EF, #F7E3C6); opacity:.5; filter:blur(2px); top:-80px; right:-80px; }
    .card {
      position:relative; width:min(520px, 92vw); background:#FFFCF6; border:2px solid #EBDCC8;
      border-radius:28px; padding:38px 40px; text-align:center;
      box-shadow:0 24px 60px rgba(122,91,62,.18);
      animation:rise .5s cubic-bezier(.2,1.2,.4,1) both;
    }
    @keyframes rise { from { opacity:0; transform:translateY(24px) scale(.96); } to { opacity:1; transform:none; } }
    .cat { font-size:64px; animation:bob 3s ease-in-out infinite; display:inline-block; }
    @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
    h1 { font-size:24px; margin:14px 0 4px; }
    .dom { font-family:Consolas,monospace; font-size:13px; background:#FFF6E9; border:1.5px solid #EBDCC8; border-radius:999px; padding:4px 14px; display:inline-block; margin:6px 0 10px; color:#8A7466; }
    p { font-size:14px; color:#8A7466; line-height:1.6; }
    .quote { font-style:italic; margin-top:16px; font-size:13px; color:#A08A79; }
    .timer { margin-top:18px; font-size:15px; font-weight:800; color:#E8886B; }
    .btns { margin-top:22px; display:flex; gap:10px; justify-content:center; }
    button { border-radius:999px; padding:11px 22px; font-size:13.5px; font-weight:700; cursor:pointer; border:1.5px solid #EBDCC8; background:#FFF6E9; color:#4A3B32; transition:transform .15s ease; }
    button:hover { transform:translateY(-2px); }
    .primary { background:#E8886B; border-color:#E8886B; color:#fff; }
    .zzz { position:absolute; font-size:20px; opacity:.6; animation:z 3s ease-in-out infinite; }
    @keyframes z { 0%,100% { transform:translate(0,0); opacity:.6; } 50% { transform:translate(8px,-12px); opacity:.2; } }
    .small { font-size:11px; color:#B49B87; margin-top:16px; }
  </style>
</head>
<body>
  <div class="moon"></div>
  <div class="card">
    <span class="zzz" style="top:26px;left:38px">💤</span>
    <span class="zzz" style="top:52px;right:52px;animation-delay:-1.4s">💤</span>
    <span class="cat">🐱</span>
    <h1 id="headline">This site is taking a nap</h1>
    <div class="dom" id="dom">…</div>
    <p id="line">…</p>
    <div class="timer" id="timer"></div>
    <div class="quote" id="quote"></div>
    <div class="btns">
      <button class="primary" id="back">← Take me back</button>
      <button id="close-tab">Close this tab</button>
    </div>
    <div class="small" id="meta"></div>
  </div>
  <script src="../rules.js"></script>
  <script src="blocked.js"></script>
</body>
</html>
