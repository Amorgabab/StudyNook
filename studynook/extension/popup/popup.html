<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../ui.css" />
  <style>
    body { width: 300px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .head { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
    .conn { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--text-muted); }
    .status { padding: 16px; display: flex; flex-direction: column; gap: 4px; }
    .state { display: flex; align-items: center; gap: 8px; font-size: 15px; line-height: 22px; font-weight: 600; }
    .state .icon { color: var(--text-muted); }
    .state.active .icon { color: var(--success); }
    .stale { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 8px; background: var(--warning-soft); font-size: 13px; line-height: 18px; }
    .pair { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    #code { letter-spacing: .3em; text-transform: uppercase; font-weight: 600; text-align: center; direction: ltr; }
    .actions { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="head">
    <span class="mark" id="mark"></span><span>StudyNook</span><span class="grow"></span>
    <span class="conn"><span class="dot" id="dot"></span><span id="conn"></span></span>
    <button class="btn btn-icon" id="sync" type="button"></button>
  </div>
  <div class="stale" id="stale" hidden><span id="stale-txt"></span><button class="btn btn-sm" id="fixstale" type="button"></button></div>
  <div class="card status">
    <div class="state" id="state"></div>
    <div class="caption" id="sess"></div>
    <div class="caption" id="sweep"></div>
    <div class="actions" id="standalone" hidden>
      <button class="btn btn-primary btn-block" id="tstart" type="button"></button>
      <button class="btn btn-block" id="tstop" type="button" hidden></button>
    </div>
  </div>
  <div class="card pair" id="paircard" hidden>
    <div class="caption" id="pair-lbl"></div>
    <input class="input" id="code" maxlength="6" placeholder="ABC123" autocomplete="off" spellcheck="false" />
    <button class="btn btn-primary btn-block" id="pair" type="button"></button>
  </div>
  <div class="caption" id="foot" style="text-align:center"></div>
  <script src="../icons.js"></script>
  <script src="../i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
